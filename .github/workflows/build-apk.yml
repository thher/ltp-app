            "French Connection":             "Godfather",
            "Salty Dog":                     "Greyhound",
            "Bay Breeze":                    "Bay Breeze",
            "Tom & Jerry":                   "Irish Coffee",
            "Brandy Crusta":                 "Sidecar",
            "Bijou":                         "Martinez",
            "Scofflaw":                      "Manhattan",
            "Revolver":                      "Manhattan",
            "Little Italy":                  "Manhattan",
            "Golden Cadillac":               "Grasshopper",
            "Midori Sour":                   "Midori Sour",
            "Tropical Punch":                "Sangria",
            "Bærpunch Norsk":                "Sangria",
            "Festpunch":                     "Sangria",
            "Cider Punch":                   "Sangria",
          }

          BASE_SEARCH = "https://www.thecocktaildb.com/api/json/v1/1/search.php?s="
          BASE_FILTER = "https://www.thecocktaildb.com/api/json/v1/1/filter.php?c="
          _cache = {}

          def fetch_json(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (compatible; DrinkMixApp/1.0)"
              })
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.loads(r.read())

          def search_db(term):
              if term in _cache:
                  return _cache[term]
              for attempt in range(3):
                  try:
                      data = fetch_json(BASE_SEARCH + urllib.parse.quote(term))
                      result = (data.get("drinks") or [None])[0]
                      img = result.get("strDrinkThumb") if result else None
                      _cache[term] = img
                      return img
                  except Exception as e:
                      if attempt < 2:
                          time.sleep(2 ** attempt)
                      else:
                          _cache[term] = None
                          return None

          # Fetch all drinks in a category for unique fallback assignment
          def fetch_category_images(category_param):
              try:
                  data = fetch_json(BASE_FILTER + urllib.parse.quote(category_param))
                  drinks = data.get("drinks") or []
                  # Return list of thumbnail URLs (already included in filter response)
                  return [d["strDrinkThumb"] for d in drinks if d.get("strDrinkThumb")]
              except Exception as e:
                  print(f"  Could not fetch category {category_param}: {e}", file=sys.stderr)
                  return []

          # Category pools — fetched once, popped from to give each drink a unique image
          print("Fetching category image pools...")
          pools = {
              "Cocktail":   fetch_category_images("Cocktail"),
              "Shot":       fetch_category_images("Shot"),
              "Longdrink":  fetch_category_images("Ordinary_Drink"),
              "Smoothie":   fetch_category_images("Punch_%2F_Party_Drink"),
              "Alkoholfri": fetch_category_images("Soft_Drink"),
              "Punch":      fetch_category_images("Punch_%2F_Party_Drink"),
              "Annet":      fetch_category_images("Cocktail"),
          }
          # Shuffle each pool so assignment order is varied
          for pool in pools.values():
              random.shuffle(pool)

          used_images = set()

          def pop_unique(category):
              pool = pools.get(category, pools["Cocktail"])
              for img in pool:
                  if img not in used_images:
                      used_images.add(img)
                      return img
              # All used — just return first
              return pool[0] if pool else None

          json_path = "assets/drinkmix_starter_database.json"
          with open(json_path) as f:
              raw = json.load(f)

          drinks = raw["data"]["drinks"]
          exact = fallback_unique = skipped = failed = 0

          for i, d in enumerate(drinks):
              name = d["name"]
              category = d.get("category", "Cocktail")

              if d.get("image"):
                  skipped += 1
                  continue

              # 1. Try exact/mapped name from thecocktaildb search
              search_term = NAME_MAP.get(name, name)
              img = search_db(search_term)

              if img:
                  d["image"] = img
                  used_images.add(img)
                  exact += 1
                  print(f"[{i+1}/{len(drinks)}] EXACT   {name}")
              else:
                  # 2. Pick unique image from category pool
                  img = pop_unique(category)
                  if img:
                      d["image"] = img
                      fallback_unique += 1
                      print(f"[{i+1}/{len(drinks)}] UNIQUE  {name}")
                  else:
                      failed += 1
                      print(f"[{i+1}/{len(drinks)}] FAILED  {name}")

              time.sleep(0.12)

          with open(json_path, "w", encoding="utf-8") as f:
              json.dump(raw, f, ensure_ascii=False, indent=2)

          total = exact + fallback_unique + skipped
          print(f"\nDone: {total}/{len(drinks)} drinks have images")
          print(f"  Exact match      : {exact}")
          print(f"  Unique fallback  : {fallback_unique}")
          print(f"  Already had      : {skipped}")
          print(f"  Failed           : {failed}")
          PYEOF

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore signing keystore
        run: |
          base64 -d android-signing/drinkmix.keystore.b64 > android/app/drinkmix.keystore

      - name: Configure release signing
        run: |
          cat >> android/gradle.properties << 'EOF'
          DRINKMIX_STORE_FILE=drinkmix.keystore
          DRINKMIX_KEY_ALIAS=drinkmix
          DRINKMIX_STORE_PASSWORD=drinkmix2024
          DRINKMIX_KEY_PASSWORD=drinkmix2024
          EOF
          python3 - << 'PYEOF'
          import re
          with open('android/app/build.gradle') as f:
              content = f.read()
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(DRINKMIX_STORE_FILE)
                      storePassword DRINKMIX_STORE_PASSWORD
                      keyAlias DRINKMIX_KEY_ALIAS
                      keyPassword DRINKMIX_KEY_PASSWORD
                  }
              }
          '''
          content = re.sub(
              r'(release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content, count=1
          )
          content = re.sub(r'(\s+buildTypes\s*\{)', signing_block + r'\1', content, count=1)
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('Signing configured successfully')
          PYEOF

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrinkMix-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
