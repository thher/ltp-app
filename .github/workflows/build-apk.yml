            'Rum Old Fashioned': 'Old Fashioned',
            'Spicy Margarita': 'Margarita',
            'Cucumber Gin & Tonic': 'Gin and Tonic',
            'Raspberry Gin Fizz': 'Gin Fizz',
            'Paloma Rosa': 'Paloma',
            'Whisky Sour Royal': 'Whiskey Sour',
            'Dark Rum & Ginger': 'Dark and Stormy',
