            'Vodka Collins': 'Tom Collins',
            'Rum Collins': 'Tom Collins',
            'Tequila Fizz': 'Gin Fizz',
            'Silver Fizz': 'Ramos Gin Fizz',
            'Spritz Bianco': 'Aperol Spritz',
            'Rossini': 'Bellini',
            'Bay Breeze Tropical': 'Bay Breeze',
            'Peach Fuzz': 'Bellini',
            'Electric Lemonade': 'Blue Lagoon',
            'Smash': 'Mint Julep',
            'Garibaldi': 'Screwdriver',
            'Godmother': 'Godfather',
            'Woo Woo': 'Sex on the Beach',
            'Alabama Slammer': 'Sex on the Beach',
            'Cactus Jack': 'Tequila Sunrise',
            'Purple Rain': 'Blue Lagoon',
            'Dirty Harry': 'Whiskey Sour',
            'Lager Top': 'Shandy Gaff',
            'Diesel': 'Black Velvet',
            'Snakebite': 'Black Velvet',
            'Toasted Almond': 'Mudslide',
            'Colorado Bulldog': 'White Russian',
            'John Collins': 'Tom Collins',
            'Swizzle': 'Dark and Stormy',
            'White Sangria': 'Sangria',
          }

          BASE = 'https://www.thecocktaildb.com/api/json/v1/1/search.php?s='

          def lookup(name):
              search = NAME_MAP.get(name, name)
              url = BASE + urllib.parse.quote(search)
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 (compatible; DrinkMixApp/1.0)'
                      })
                      with urllib.request.urlopen(req, timeout=10) as r:
                          data = json.loads(r.read())
                      drinks_list = data.get('drinks') or []
                      if drinks_list:
                          return drinks_list[0].get('strDrinkThumb')
                      return None
                  except Exception as e:
                      if attempt < 2:
                          time.sleep(2 ** attempt)
                      else:
                          print(f'  FAILED {name}: {e}', file=sys.stderr)
                          return None

          json_path = 'assets/drinkmix_starter_database.json'
          with open(json_path) as f:
              raw = json.load(f)

          drinks = raw['data']['drinks']
          found = 0

          for i, d in enumerate(drinks):
              name = d['name']
              if d.get('image'):
                  found += 1
                  continue
              url = lookup(name)
              if url:
                  d['image'] = url
                  found += 1
                  print(f'[{i+1}/{len(drinks)}] OK   {name}')
              else:
                  print(f'[{i+1}/{len(drinks)}] MISS {name}')
              time.sleep(0.15)

          with open(json_path, 'w', encoding='utf-8') as f:
              json.dump(raw, f, ensure_ascii=False, indent=2)

          print(f'\nImages: {found}/{len(drinks)} populated')
          PYEOF

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore signing keystore
        run: |
          base64 -d android-signing/drinkmix.keystore.b64 > android/app/drinkmix.keystore

      - name: Configure release signing
        run: |
          cat >> android/gradle.properties << 'EOF'
          DRINKMIX_STORE_FILE=drinkmix.keystore
          DRINKMIX_KEY_ALIAS=drinkmix
          DRINKMIX_STORE_PASSWORD=drinkmix2024
          DRINKMIX_KEY_PASSWORD=drinkmix2024
          EOF
          python3 << 'PYEOF'
          import re
          with open('android/app/build.gradle') as f:
              content = f.read()
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(DRINKMIX_STORE_FILE)
                      storePassword DRINKMIX_STORE_PASSWORD
                      keyAlias DRINKMIX_KEY_ALIAS
                      keyPassword DRINKMIX_KEY_PASSWORD
                  }
              }
          '''
          # Step 1: patch buildTypes.release FIRST (only one "release {" exists at this point)
          content = re.sub(
              r'(release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content, count=1
          )
          # Step 2: then insert signingConfigs block before buildTypes
          content = re.sub(r'(\s+buildTypes\s*\{)', signing_block + r'\1', content, count=1)
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('Signing configured successfully')
          PYEOF

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrinkMix-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
