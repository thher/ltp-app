name: Build Android APK

on:
  push:
    branches:
      - claude/drinkmix-mobile-app-9m9ph9
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Restore signing keystore
        run: |
          base64 -d android-signing/drinkmix.keystore.b64 > android/app/drinkmix.keystore

      - name: Configure release signing
        run: |
          cat >> android/gradle.properties << 'EOF'
          DRINKMIX_STORE_FILE=drinkmix.keystore
          DRINKMIX_KEY_ALIAS=drinkmix
          DRINKMIX_STORE_PASSWORD=drinkmix2024
          DRINKMIX_KEY_PASSWORD=drinkmix2024
          EOF
          python3 << 'PYEOF'
          import re
          with open('android/app/build.gradle') as f:
              content = f.read()
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(DRINKMIX_STORE_FILE)
                      storePassword DRINKMIX_STORE_PASSWORD
                      keyAlias DRINKMIX_KEY_ALIAS
                      keyPassword DRINKMIX_KEY_PASSWORD
                  }
              }
          '''
          # Insert signing config before buildTypes
          content = re.sub(r'(\s+buildTypes\s*\{)', signing_block + r'\1', content, count=1)
          # Add signingConfig to release buildType
          content = re.sub(
              r'(release\s*\{)',
              r'\1\n            signingConfig signingConfigs.release',
              content, count=1
          )
          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('Signing configured successfully')
          PYEOF

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrinkMix-release
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
