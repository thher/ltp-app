name: Update Drink Images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update images on'
        required: false
        default: 'claude/drinkmix-mobile-app-9m9ph9'

jobs:
  fetch-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch drink images from thecocktaildb
