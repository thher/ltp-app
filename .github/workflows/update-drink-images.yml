            'Bay Breeze Tropical': 'Bay Breeze',
            'Harvey Wallbanger Sour': 'Harvey Wallbanger',
            'Peach Fuzz': 'Bellini',
            'Electric Lemonade': 'Blue Lagoon',
            'Smash': 'Mint Julep',
            'Garibaldi': 'Screwdriver',
            'Godmother': 'Godfather',
            'Woo Woo': 'Sex on the Beach',
            'Alabama Slammer': 'Sex on the Beach',
            'Cactus Jack': 'Tequila Sunrise',
            'Purple Rain': 'Blue Lagoon',
            'Dirty Harry': 'Whiskey Sour',
            'Lager Top': 'Shandy Gaff',
            'Diesel': 'Black Velvet',
            'Snakebite': 'Black Velvet',
            'Toasted Almond': 'Mudslide',
            'Colorado Bulldog': 'White Russian',
            'John Collins': 'Tom Collins',
            'Swizzle': 'Rum Swizzle',
          }

          BASE = 'https://www.thecocktaildb.com/api/json/v1/1/search.php?s='

          def lookup(name):
              search = NAME_MAP.get(name, name)
              url = BASE + urllib.parse.quote(search)
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'Mozilla/5.0 (compatible; DrinkMixApp/1.0)'
                      })
                      with urllib.request.urlopen(req, timeout=10) as r:
                          data = json.loads(r.read())
                      drinks = data.get('drinks') or []
                      if drinks:
                          return drinks[0].get('strDrinkThumb')
                      return None
                  except Exception as e:
                      if attempt < 2:
                          time.sleep(2)
                      else:
                          print(f'  FAILED {name}: {e}', file=sys.stderr)
                          return None

          json_path = 'assets/drinkmix_starter_database.json'
          with open(json_path) as f:
              data = json.load(f)

          drinks = data['data']['drinks']
          found = 0
          not_found = []

          for i, d in enumerate(drinks):
              name = d['name']
              if d.get('image'):
                  print(f'[{i+1}/{len(drinks)}] SKIP {name}')
                  found += 1
                  continue
              url = lookup(name)
              if url:
                  d['image'] = url
                  found += 1
                  print(f'[{i+1}/{len(drinks)}] OK   {name}')
              else:
                  not_found.append(name)
                  print(f'[{i+1}/{len(drinks)}] MISS {name}')
              time.sleep(0.2)

          with open(json_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f'\nResult: {found}/{len(drinks)} images')
          if not_found:
              print('Still missing:')
              for n in not_found:
                  print(f'  {n}')
          PYEOF

      - name: Commit updated images
        run: |
          git config user.name "DrinkMix Bot"
          git config user.email "noreply@github.com"
          git add assets/drinkmix_starter_database.json
          if git diff --cached --quiet; then
            echo "No changes to commit (all images already present)"
          else
            git commit -m "chore: pre-populate drink images from thecocktaildb"
            git push origin ${{ github.event.inputs.branch }}
            echo "Images updated and pushed!"
          fi
